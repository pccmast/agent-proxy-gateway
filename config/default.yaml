# Gateway Configuration
proxy:
  host: "0.0.0.0"
  port: 18080
  upstream_timeout: 120

  providers:
    openai:
      base_url: "https://api.deepseek.com"
      api_key_env: "OPENAI_API_KEY"
      default_model: "deepseek-chat"

    anthropic:
      base_url: "https://api.anthropic.com"
      api_key_env: "ANTHROPIC_API_KEY"
      default_model: "claude-3-opus-20240229"

    deepseek:
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      default_model: "deepseek-chat"

# Trace Configuration
trace:
  db_path: "data/gateway.db"
  max_span_depth: 10
  # 采样率：1.0 = 全采样；0.1 = 正常请求仅 10% 落库（错误/超时/拦截强制落库）
  sample_rate: 1.0
  # 异步批量写盘：false = 同步写；true = 内存队列 + 后台批量刷库（主路径不阻塞）
  async_write: false

# Guardrails Configuration — see guardrails.yaml for rules
guardrails:
  enabled: true

# Budget & Rate Control
budget:
  defaults:
    max_tokens_per_day: 1000000
    max_tokens_per_hour: 100000
    warning_threshold: 0.8
  agents: {}

rate_limit:
  defaults:
    rpm: 60
    tpm: 100000
  per_model:
    "gpt-4o":
      rpm: 30
      tpm: 50000

circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 30
  half_open_max_calls: 1

# Eval Pipeline — lightweight heuristic checks only.
# LLM-as-Judge evaluation is NOT included here by design:
# full-quality assessment belongs in a separate offline evaluation system,
# not inside the gateway's request path.
eval:
  heuristic:
    enabled: true
    max_response_length: 10000
    repetition_threshold: 0.3
    latency_p99_threshold_ms: 5000