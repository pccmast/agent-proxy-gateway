# Per-million-token USD pricing overrides.
#
# Edits here take effect on gateway startup (and on hot-reload when
# GATEWAY_WATCH=1 reloads config). Rates are in USD per 1,000,000 tokens,
# matching the built-in defaults below. You only need to list the models/tiers
# you want to override — missing tiers inherit the built-in defaults, and a
# missing or malformed file is ignored (built-in defaults are used).
#
# Four tiers per model:
#   input          regular prompt tokens
#   cached_input   prompt tokens served from a provider cache (discounted)
#   cache_creation tokens written into a provider cache (often a premium)
#   output         completion tokens

